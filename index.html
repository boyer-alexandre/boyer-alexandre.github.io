<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Animation GPX 3D - Mapbox</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  // 1. Remplace avec ton propre token Mapbox
  mapboxgl.accessToken = 'TON_MAPBOX_ACCESS_TOKEN';

  // 2. Coordonnées de test [Longitude, Latitude, Altitude]
  const gpxCoordinates = [
    [6.128, 45.899, 450],
    [6.135, 45.905, 520],
    [6.142, 45.912, 680],
    [6.150, 45.920, 890],
    [6.160, 45.925, 1100]
  ];

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/satellite-streets-v12',
    center: gpxCoordinates[0],
    zoom: 13,
    pitch: 65, // Inclinaison de la caméra pour l'effet 3D
    bearing: -30
  });

  map.on('load', () => {
    // 3. Ajout de la source de terrain pour le relief 3D
    map.addSource('mapbox-dem', {
      'type': 'raster-dem',
      'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
      'tileSize': 512,
      'maxzoom': 14
    });
    map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

    // 4. Source GeoJSON vide au démarrage (se remplit progressivement)
    map.addSource('trace', {
      'type': 'geojson',
      'data': {
        'type': 'Feature',
        'properties': {},
        'geometry': {
          'type': 'LineString',
          'coordinates': [gpxCoordinates[0]]
        }
      }
    });

    // 5. Couche visuelle pour la ligne 3D
    map.addLayer({
      'id': 'trace-line',
      'type': 'line',
      'source': 'trace',
      'paint': {
        'line-color': '#ff0055',
        'line-width': 5
      }
    });

    // 6. Animation du tracé et de la caméra
    let step = 0;
    function animate() {
      if (step < gpxCoordinates.length) {
        // Ajouter le point courant au tracé
        const currentCoordinates = gpxCoordinates.slice(0, step + 1);
        map.getSource('trace').setData({
          'type': 'Feature',
          'properties': {},
          'geometry': {
            'type': 'LineString',
            'coordinates': currentCoordinates
          }
        });

        // Déplacer la caméra pour suivre la tête de course
        const target = gpxCoordinates[step];
        map.easeTo({
          center: [target[0], target[1]],
          zoom: 14,
          duration: 300,
          easing: (t) => t
        });

        step++;
        setTimeout(animate, 300); // Vitesse de l'animation
      }
    }

    animate();
  });
</script>
</body>
</html>
