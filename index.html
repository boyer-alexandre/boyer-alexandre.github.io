<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS → Vidéo 3D</title>
<script src="https://cdn.maptiler.com/maplibre-gl-js/v4.7.1/maplibre-gl.js"></script>
<link href="https://cdn.maptiler.com/maplibre-gl-js/v4.7.1/maplibre-gl.css" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1115;
    color: #eee;
    margin: 0;
    padding: 20px;
    max-width: 720px;
    margin-inline: auto;
  }
  h1 { font-size: 22px; text-align: center; margin-bottom: 20px; }
  .panel {
    background: #1a1d24;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 14px;
    color: #aaa;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="file"] {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #10121a;
    color: #eee;
    font-size: 15px;
  }
  small { color: #777; display:block; margin-top:6px; font-size:12px; }
  small a { color: #4da3ff; }
  button, .btn {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    background: #ff3d00;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
  }
  button:disabled { background: #3a3a3a; cursor: not-allowed; }
  #status { margin-top: 12px; font-size: 14px; color: #ccc; text-align: center; }
  progress { width: 100%; margin-top: 10px; height: 8px; }
  #mapContainer {
    width: 100%;
    height: 400px;
    border-radius: 14px;
    overflow: hidden;
    background: #10121a;
    margin-bottom: 16px;
  }
  #recordCanvas { display: none; }
  video { width: 100%; border-radius: 10px; display:block; margin-bottom: 10px; }
</style>
</head>
<body>

<h1>🏃 GPS → Vidéo 3D</h1>

<div class="panel" id="setup-panel">
  <label>1. Clé API MapTiler (gratuite)</label>
  <input id="apiKey" type="text" placeholder="Colle ta clé ici">
  <small>Pas encore de clé ? <a href="https://www.maptiler.com/cloud/" target="_blank">Crée-en une gratuitement ici</a>.</small>

  <label>2. Fichier GPS</label>
  <input id="fileInput" type="file" accept=".gpx,.kml,.tcx">
  <small>Formats acceptés : GPX, KML, TCX</small>

  <button id="createBtn" disabled>3. Créer la vidéo</button>

  <div id="status"></div>
  <progress id="progressBar" value="0" max="100" style="display:none"></progress>
</div>

<div id="mapContainer"></div>
<canvas id="recordCanvas"></canvas>

<div class="panel" id="resultPanel" style="display:none">
  <video id="resultVideo" controls></video>
  <a id="downloadBtn" class="btn" download="parcours.webm">⬇️ Télécharger la vidéo</a>
</div>

<script>
const apiKeyInput = document.getElementById('apiKey');
const fileInput = document.getElementById('fileInput');
const createBtn = document.getElementById('createBtn');
const statusEl = document.getElementById('status');
const progressBar = document.getElementById('progressBar');
const mapContainer = document.getElementById('mapContainer');
const resultPanel = document.getElementById('resultPanel');

const FPS = 30;
const VIDEO_DURATION = 30; // secondes

// ---------- Sauvegarde de la clé API ----------
window.addEventListener('load', () => {
  const saved = localStorage.getItem('maptiler_key');
  if (saved) apiKeyInput.value = saved;
  updateButtonState();
});
apiKeyInput.addEventListener('input', () => {
  localStorage.setItem('maptiler_key', apiKeyInput.value.trim());
  updateButtonState();
});
fileInput.addEventListener('change', updateButtonState);
function updateButtonState() {
  createBtn.disabled = !(fileInput.files.length && apiKeyInput.value.trim());
}

// ---------- Parsers GPS ----------
function parseGPX(text) {
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  const trkpts = [...doc.getElementsByTagName('trkpt')];
  return trkpts.map(pt => {
    const eleEl = pt.getElementsByTagName('ele')[0];
    const timeEl = pt.getElementsByTagName('time')[0];
    return {
      lat: parseFloat(pt.getAttribute('lat')),
      lon: parseFloat(pt.getAttribute('lon')),
      ele: eleEl ? parseFloat(eleEl.textContent) : 0,
      time: timeEl ? new Date(timeEl.textContent) : null
    };
  });
}

function parseKML(text) {
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  const whens = [...doc.getElementsByTagName('when')];
  const coords = [...doc.getElementsByTagName('gx:coord')];
  if (whens.length && coords.length === whens.length) {
    return coords.map((c, i) => {
      const [lon, lat, ele] = c.textContent.trim().split(' ').map(Number);
      return { lat, lon, ele: ele || 0, time: new Date(whens[i].textContent) };
    });
  }
  const coordEl = doc.getElementsByTagName('coordinates')[0];
  if (coordEl) {
    return coordEl.textContent.trim().split(/\s+/).map(s => {
      const [lon, lat, ele] = s.split(',').map(Number);
      return { lat, lon, ele: ele || 0, time: null };
    });
  }
  return [];
}

function parseTCX(text) {
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  const tps = [...doc.getElementsByTagName('Trackpoint')];
  return tps.map(tp => {
    const latEl = tp.getElementsByTagName('LatitudeDegrees')[0];
    const lonEl = tp.getElementsByTagName('LongitudeDegrees')[0];
    if (!latEl || !lonEl) return null;
    const eleEl = tp.getElementsByTagName('AltitudeMeters')[0];
    const timeEl = tp.getElementsByTagName('Time')[0];
    return {
      lat: parseFloat(latEl.textContent),
      lon: parseFloat(lonEl.textContent),
      ele: eleEl ? parseFloat(eleEl.textContent) : 0,
      time: timeEl ? new Date(timeEl.textContent) : null
    };
  }).filter(Boolean);
}

// ---------- Calculs géo ----------
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function computeBearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
  const y = Math.sin(toRad(lon2-lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function enrichTrack(points) {
  points = points.filter(p => !isNaN(p.lat) && !isNaN(p.lon));
  const hasTime = points.every(p => p.time);
  if (!hasTime) {
    const start = new Date();
    points = points.map((p, i) => ({ ...p, time: new Date(start.getTime() + i * 1000) }));
  }
  let cumDist = 0;
  return points.map((p, i) => {
    if (i === 0) return { ...p, cumDist: 0, elapsed: 0, speed: 0, bearing: 0 };
    const prev = points[i-1];
    const segDist = haversine(prev.lat, prev.lon, p.lat, p.lon);
    cumDist += segDist;
    const dt = (p.time - prev.time) / 1000;
    const speed = dt > 0 ? segDist / dt : 0;
    const elapsed = (p.time - points[0].time) / 1000;
    const bearing = computeBearing(prev.lat, prev.lon, p.lat, p.lon);
    return { ...p, cumDist, elapsed, speed, bearing };
  });
}

function interpolateAt(track, targetElapsed) {
  const last = track[track.length - 1];
  if (targetElapsed <= 0) return track[0];
  if (targetElapsed >= last.elapsed) return last;
  let i = 1;
  while (track[i].elapsed < targetElapsed) i++;
  const p0 = track[i-1], p1 = track[i];
  const span = p1.elapsed - p0.elapsed;
  const f = span > 0 ? (targetElapsed - p0.elapsed) / span : 0;
  return {
    lat: p0.lat + (p1.lat - p0.lat) * f,
    lon: p0.lon + (p1.lon - p0.lon) * f,
    cumDist: p0.cumDist + (p1.cumDist - p0.cumDist) * f,
    elapsed: targetElapsed,
    speed: p0.speed + (p1.speed - p0.speed) * f,
    bearing: p1.bearing
  };
}

function formatTime(s) {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${m}:${String(sec).padStart(2,'0')}`;
}

// ---------- Dessin de l'overlay stats ----------
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function drawOverlay(ctx, state, w, h) {
  const distKm = (state.cumDist / 1000).toFixed(2);
  const speedKmh = (state.speed * 3.6).toFixed(1);
  const timeStr = formatTime(state.elapsed);
  const boxH = 90, margin = 20;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(ctx, margin, h - boxH - margin, w - margin*2, boxH, 16);
  ctx.fill();

  const cols = [
    { label: 'Distance', value: `${distKm} km` },
    { label: 'Temps', value: timeStr },
    { label: 'Vitesse', value: `${speedKmh} km/h` }
  ];
  const colW = (w - margin*2) / 3;
  cols.forEach((c, i) => {
    const x = margin + colW*i + colW/2;
    ctx.textAlign = 'center';
    ctx.font = '13px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(c.label, x, h - boxH - margin + 26);
    ctx.font = 'bold 26px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(c.value, x, h - boxH - margin + 58);
  });
  ctx.restore();
}

// ---------- Carte + animation + enregistrement ----------
let map;
function initMap(apiKey, track) {
  map = new maplibregl.Map({
    container: 'mapContainer',
    style: `https://api.maptiler.com/maps/satellite/style.json?key=${apiKey}`,
    center: [track[0].lon, track[0].lat],
    zoom: 16,
    pitch: 60,
    bearing: 0,
    antialias: true,
    preserveDrawingBuffer: true
  });

  map.on('load', () => {
    map.addSource('terrainSource', {
      type: 'raster-dem',
      url: `https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=${apiKey}`,
      tileSize: 256
    });
    map.setTerrain({ source: 'terrainSource', exaggeration: 1.3 });

    map.addLayer({
      id: 'sky',
      type: 'sky',
      paint: { 'sky-type': 'atmosphere', 'sky-atmosphere-sun-intensity': 15 }
    });

    map.addSource('route', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'LineString', coordinates: track.map(p => [p.lon, p.lat]) } }
    });
    map.addLayer({
      id: 'route-line',
      type: 'line',
      source: 'route',
      paint: { 'line-color': '#ff3d00', 'line-width': 4 }
    });

    map.addSource('marker', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'Point', coordinates: [track[0].lon, track[0].lat] } }
    });
    map.addLayer({
      id: 'marker-point',
      type: 'circle',
      source: 'marker',
      paint: { 'circle-radius': 8, 'circle-color': '#ffffff', 'circle-stroke-color': '#ff3d00', 'circle-stroke-width': 3 }
    });

    setTimeout(() => startRecording(track), 500);
  });

  map.on('error', (e) => {
    statusEl.textContent = "Erreur carte : vérifie ta clé API MapTiler.";
    createBtn.disabled = false;
    console.error(e);
  });
}

function startRecording(track) {
  const totalElapsed = track[track.length - 1].elapsed;
  const totalFrames = FPS * VIDEO_DURATION;
  const recordCanvas = document.getElementById('recordCanvas');
  const mapCanvas = map.getCanvas();
  recordCanvas.width = mapCanvas.width;
  recordCanvas.height = mapCanvas.height;
  const ctx = recordCanvas.getContext('2d');

  const stream = recordCanvas.captureStream(FPS);
  let mimeType = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 6000000 });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    document.getElementById('resultVideo').src = url;
    const dl = document.getElementById('downloadBtn');
    dl.href = url;
    resultPanel.style.display = 'block';
    statusEl.textContent = '✅ Vidéo prête !';
    progressBar.style.display = 'none';
    createBtn.disabled = false;
  };
  recorder.start();

  let frame = 0;
  function renderFrame() {
    if (frame > totalFrames) { recorder.stop(); return; }
    const frac = frame / totalFrames;
    const targetElapsed = frac * totalElapsed;
    const state = interpolateAt(track, targetElapsed);

    map.jumpTo({ center: [state.lon, state.lat], bearing: state.bearing, pitch: 60, zoom: 16 });
    map.getSource('marker').setData({ type: 'Feature', geometry: { type: 'Point', coordinates: [state.lon, state.lat] } });

    requestAnimationFrame(() => {
      ctx.drawImage(mapCanvas, 0, 0, recordCanvas.width, recordCanvas.height);
      drawOverlay(ctx, state, recordCanvas.width, recordCanvas.height);
      frame++;
      progressBar.value = (frame / totalFrames) * 100;
      renderFrame();
    });
  }
  renderFrame();
}

// ---------- Bouton principal ----------
createBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  const apiKey = apiKeyInput.value.trim();
  if (!file || !apiKey) return;

  createBtn.disabled = true;
  resultPanel.style.display = 'none';
  progressBar.style.display = 'block';
  progressBar.value = 0;
  statusEl.textContent = 'Lecture du fichier...';

  const text = await file.text();
  const ext = file.name.split('.').pop().toLowerCase();
  let points = [];
  try {
    if (ext === 'gpx') points = parseGPX(text);
    else if (ext === 'kml') points = parseKML(text);
    else if (ext === 'tcx') points = parseTCX(text);
    else throw new Error('Format non supporté');
  } catch (e) {
    statusEl.textContent = 'Erreur lecture fichier : ' + e.message;
    createBtn.disabled = false;
    return;
  }

  if (points.length < 2) {
    statusEl.textContent = 'Fichier invalide ou trop court.';
    createBtn.disabled = false;
    return;
  }

  const track = enrichTrack(points);
  statusEl.textContent = 'Génération de la vidéo (30s)...';
  initMap(apiKey, track);
});
</script>
</body>
</html>
